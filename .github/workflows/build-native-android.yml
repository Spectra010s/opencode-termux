name: Build locked OpenCode v2 for native Android

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Build strategy for the unsigned candidate
        type: choice
        required: true
        default: bundle
        options:
          - bundle
          - source

permissions:
  contents: read

env:
  ANDROID_API: "28"

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve pinned versions from lock
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          lock = json.load(open("tools/supply-chain-lock.json", encoding="utf-8"))
          version = lock["current"]
          opencode = lock["opencode"][version]
          opentui_version = opencode["opentui_version"]
          opentui = lock["opentui"][opentui_version]
          print(f"OPENCODE_VERSION={version}")
          print(f"OPENTUI_VERSION={opentui_version}")
          print(f"OPENTUI_COMMIT={opentui['commit']}")
          print(f"ZIG_VERSION={opentui['zig_version']}")
          PY

      - name: Fetch pinned OpenTUI source
        run: |
          set -euo pipefail
          mkdir -p work/opentui
          git -C work/opentui init .
          git -C work/opentui remote add origin https://github.com/anomalyco/opentui.git
          git -C work/opentui fetch --depth=1 origin "$OPENTUI_COMMIT"
          git -C work/opentui checkout --detach FETCH_HEAD

      - name: Install hash-verified Zig
        run: |
          set -euo pipefail
          URL="https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          SHA="$(python3 -c 'import json,os; print(json.load(open("tools/supply-chain-lock.json"))["opentui"][os.environ["OPENTUI_VERSION"]]["zig_x86_64_linux_sha256"])')"
          mkdir -p work
          curl -fsSLo work/zig.tar.xz "$URL"
          echo "$SHA  work/zig.tar.xz" | sha256sum -c -
          tar -xJf work/zig.tar.xz -C work
          echo "$GITHUB_WORKSPACE/work/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Verify locked metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          lock = json.load(open("tools/supply-chain-lock.json", encoding="utf-8"))
          bind = json.load(open("tools/transplant/config/bun-bind.json", encoding="utf-8"))
          oc = lock["opencode"][os.environ["OPENCODE_VERSION"]]
          ot = lock["opentui"][os.environ["OPENTUI_VERSION"]]
          bun_version = oc["bun_version"]
          bun = lock["android_bun"][bun_version]
          assert ot["commit"] == os.environ["OPENTUI_COMMIT"]
          assert ot["zig_version"] == os.environ["ZIG_VERSION"]
          # Source build and upstream transplant both consume the same pinned
          # Android Bun base, so one config covers both strategies.
          head = subprocess.check_output(
              ["git", "-C", "work/opentui", "rev-parse", "HEAD"], text=True
          ).strip()
          assert head == ot["commit"], (head, ot["commit"])
          # A bundle runs on Termux's bun package, so the pinned Android Bun
          # base only matters to the strategies that compile an ELF.
          if os.environ["BUILD_STRATEGY"] != "bundle":
              assert bind["target"] == bun_version, (bind["target"], bun_version)
              assert bind["archive_sha256"] == bun["archive_sha256"]
              assert bind["elf_sha256"] == bun["elf_sha256"]
          if os.environ["BUILD_STRATEGY"] == "upstream-transplant":
              assert len(oc["cli_linux_arm64_sha256"]) == 64
          PY
          test "$(zig version)" = "$ZIG_VERSION"
        env:
          BUILD_STRATEGY: ${{ inputs.strategy }}

      - name: Apply OpenTUI Android hardening
        run: |
          set -euo pipefail
          python3 tools/patch-opentui-android.py work/opentui
          git -C work/opentui diff --check

      - name: Build Bionic OpenTUI library
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          test -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBDIR="$SYSROOT/usr/lib/aarch64-linux-android/$ANDROID_API"
          test -d "$LIBDIR"
          LLVM_STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$LLVM_STRIP"
          echo "LLVM_STRIP=$LLVM_STRIP" >> "$GITHUB_ENV"
          mkdir -p work artifacts/transplant/opentui-bionic
          {
            # Zig 0.17.0 requires every libc field, including the new
            # `cc_dir` and `darwin_sdk_dir`, and rejects an empty `cc_dir` for
            # linux targets. `gcc_dir` is the 0.16 field name and a 0.17 alias
            # for `cc_dir`, so emitting that spelling keeps one file valid on
            # either toolchain. cc_dir holds crtbegin_so.o, which for the NDK
            # is the same API-level lib dir as crt_dir.
            echo "include_dir=$SYSROOT/usr/include/aarch64-linux-android"
            echo "sys_include_dir=$SYSROOT/usr/include"
            echo "crt_dir=$LIBDIR"
            echo "msvc_lib_dir="
            echo "kernel32_lib_dir="
            echo "gcc_dir=$LIBDIR"
            echo "darwin_sdk_dir="
          } > work/android-libc.txt
          sh work/opentui/packages/native/scripts/prepare-zig-deps.sh
          (
            cd work/opentui/packages/native
            OPENTUI_C_REMAP="-ffile-prefix-map=$GITHUB_WORKSPACE=/usr/src -D__ANDROID_MIN_SDK_VERSION__=28 -D__ANDROID_API__=28" \
            BIONIC_ARCH_INCLUDE="$SYSROOT/usr/include/aarch64-linux-android" \
            BIONIC_SYS_INCLUDE="$SYSROOT/usr/include" \
            BIONIC_LIB_DIR="$LIBDIR" \
              zig build -Dlibrary-target=aarch64-linux-android.28 \
                -Doptimize=ReleaseSafe --libc "$GITHUB_WORKSPACE/work/android-libc.txt"
          )
          SO="work/opentui/packages/native/lib/aarch64-linux-android.28/libopentui.so"
          test -f "$SO"
          python3 tools/remap-binary-prefix.py "$SO" "$GITHUB_WORKSPACE" /usr/src
          # Keep this lib unstripped: the guard gate scans local guard-owner
          # symbols, and llvm-strip --strip-unneeded deletes them. The
          # transplant swap verifies the unstripped build, then strips to fit
          # the embedded slot.
          cp "$SO" artifacts/transplant/opentui-bionic/libopentui.so

      - name: Verify Bionic library
        run: |
          set -euo pipefail
          SO=artifacts/transplant/opentui-bionic/libopentui.so
          file "$SO" | grep -q 'ARM aarch64'
          readelf -d "$SO" > work/opentui-needed.txt
          grep -q 'NEEDED.*libc.so' work/opentui-needed.txt
          if grep -q 'libc.so.6' work/opentui-needed.txt; then
            echo "glibc dependency found in Bionic library" >&2
            exit 1
          fi
          if readelf -Ws "$SO" | grep -E 'UND[[:space:]]+pthread_tryjoin_np' >/dev/null; then
            echo "glibc-only pthread_tryjoin_np import found in Bionic library" >&2
            exit 1
          fi
          python3 -c 'import sys; sys.path.insert(0,"tools/transplant"); from swap_tui import has_ffi_guard; assert has_ffi_guard(open(sys.argv[1],"rb").read())' "$SO"
          if grep -aFq "$GITHUB_WORKSPACE" "$SO"; then
            echo "build workspace path leaked into library" >&2
            exit 1
          fi

      - name: Build Android runtime bundle
        if: ${{ inputs.strategy == 'bundle' }}
        run: |
          set -euo pipefail
          test -n "$NDK"
          # bun-pty's rust-pty is cross-built for bionic; the NDK linker it
          # needs is the same one the OpenTUI step resolved above.
          rustup target add aarch64-linux-android
          bash scripts/ci/build-opencode-bundle.sh

      - name: Download and verify locked OpenCode v2 package
        if: ${{ inputs.strategy == 'upstream-transplant' }}
        run: |
          set -euo pipefail
          mkdir -p work/npm
          NAME="$(npm pack "@opencode/cli-linux-arm64@$OPENCODE_VERSION" --pack-destination work/npm --silent | tail -1)"
          TGZ="work/npm/$NAME"
          test -f "$TGZ"
          python3 tools/verify-release-input.py \
            --kind opencode-cli --version "$OPENCODE_VERSION" --file "$TGZ"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Transplant onto verified Android Bun
        if: ${{ inputs.strategy == 'upstream-transplant' }}
        run: |
          set -euo pipefail
          python3 tools/transplant/transplant.py all \
            --ver "$OPENCODE_VERSION" --tgz "$TGZ" --no-execve
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path("artifacts/transplant") / os.environ["OPENCODE_VERSION"]
          report = json.loads((out / "report.json").read_text(encoding="utf-8"))
          assert report["steps"]["swap"]["status"] == "ok", report["steps"].get("swap")
          product = out / "opencode-native-tui"
          assert product.is_file() and product.stat().st_size > 50_000_000
          PY

      - name: Build version-matched source package and transplant it
        if: ${{ inputs.strategy == 'source' }}
        run: bash scripts/ci/build-opencode-source.sh

      - name: Stage release candidate
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ inputs.strategy }}" = bundle ]; then
            bash scripts/ci/package-release-bundle.sh \
              "artifacts/bundle/$OPENCODE_VERSION" "$OPENCODE_VERSION" dist
            cp "artifacts/bundle/$OPENCODE_VERSION/report.json" dist/report.json
          else
            OUT="artifacts/transplant/$OPENCODE_VERSION"
            if [ "${{ inputs.strategy }}" = source ]; then
              NAME="$(python3 tools/ocver.py asset source)"
            else
              NAME="opencode-$OPENCODE_VERSION-android-aarch64"
            fi
            install -m 0755 "$OUT/opencode-native-tui" "dist/$NAME"
            file "dist/$NAME" | grep -q 'ARM aarch64'
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
            cp "$OUT/report.json" dist/transplant-report.json
            bash scripts/ci/package-release-deb.sh "dist/$NAME" "$OPENCODE_VERSION" dist
          fi
          cp tools/supply-chain-lock.json dist/supply-chain-lock.json
          python3 tools/gen-packages-index.py dist/Packages.gz dist
          gzip -dc dist/Packages.gz | grep -q '^Package: opencode$'
          python3 scripts/ci/write-flat-apt-release.py dist
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload unsigned runtime-test candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: opencode-${{ env.OPENCODE_VERSION }}-android-aarch64-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # Bisection aid: the compiled-but-not-transplanted ELF. If the candidate
      # crashes on device, fetching this one too says whether the graph or the
      # splice onto the Android Bun base is at fault. Download only on demand.
      - name: Upload pre-transplant ELF for bisection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: opencode-${{ env.OPENCODE_VERSION }}-android-aarch64-${{ inputs.strategy }}-pre-transplant
          path: work/source-bun/*/pre-transplant-opencode
          if-no-files-found: ignore
          retention-days: 14

      # The bionic renderer library that gets grafted into the candidate (the
      # stripped build that actually fits the embedded slot). Tiny, and it lets
      # the swap be reproduced/verified off-CI without a rebuild.
      - name: Upload bionic libopentui
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: opencode-${{ env.OPENCODE_VERSION }}-android-aarch64-libopentui
          path: work/source-bun/*/libopentui-stripped.so
          if-no-files-found: error
          retention-days: 14
