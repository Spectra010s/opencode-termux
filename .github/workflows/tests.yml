# Shell unit tests (bats)
#
# Scope note: this workflow runs unit tests for the build/packaging shell
# helpers only. Release builds and publishing happen in
# build-native-android.yml and publish-native-android.yml; see
# .github/ACTIONS_DISABLED.md.

name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Show environment
        run: |
          bash --version | head -1
          python3 --version

      - name: Run shell unit tests
        run: ./tests/run.sh
