name: Publish native Android release

# Tag driven: pushing v<version> builds, signs and publishes in one run.

on:
  push:
    tags: ["v*"]
  # Retry: dispatch with --ref v<version>.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-native-android.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Resolve the release identity
        run: |
          set -euo pipefail
          {
            printf 'VERSION=%s\n' "$(python3 tools/ocver.py current)"
            printf 'REVISION=%s\n' "$(python3 tools/ocver.py revision)"
            printf 'RELEASE_TAG=%s\n' "$(python3 tools/ocver.py tag)"
            printf 'CANDIDATE=opencode-%s-android-aarch64-candidate\n' "$(python3 tools/ocver.py current)"
          } >> "$GITHUB_ENV"

      - name: Check the release contract
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag || {
            echo "publishing needs a tag: dispatch this workflow with --ref $RELEASE_TAG" >&2
            exit 1
          }
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG" || {
            echo "tag $GITHUB_REF_NAME does not match lock version $RELEASE_TAG" >&2
            exit 1
          }
          NOTES=".release/v$VERSION.md"
          git ls-files --error-unmatch "$NOTES" >/dev/null || {
            echo "missing release notes: $NOTES" >&2
            exit 1
          }
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Download the build from this run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: opencode-${{ env.VERSION }}-android-aarch64-candidate
          path: dist

      - name: Verify the build
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          DEB="opencode_${VERSION}-${REVISION}_aarch64.deb"
          test -f "$DEB"
          test "$(dpkg-deb --field "$DEB" Package)" = opencode
          test "$(dpkg-deb --field "$DEB" Version)" = "$VERSION-$REVISION"
          dpkg-deb --field "$DEB" Depends | grep -q 'bun'
          TARBALL="$(ls ./*.tar.gz)"
          test "$(printf '%s\n' "$TARBALL" | wc -l)" -eq 1
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/listing.txt"
          grep -qx bin/opencode "$RUNNER_TEMP/listing.txt"
          grep -qx lib/opencode/index.js "$RUNNER_TEMP/listing.txt"
          gzip -dc Packages.gz | grep -qx "Version: $VERSION-$REVISION"

      - name: Sign the APT index
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_GPG_PRIVATE_KEY"
          printf '%s' "$APT_GPG_PRIVATE_KEY" |
            bash scripts/ci/sign-apt-index.sh dist/Release apt/opencode-termux.gpg dist
          (cd dist && sha256sum Release.gpg InRelease >> SHA256SUMS)

      - name: Publish the release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* apt/opencode-termux.gpg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenCode $VERSION for Termux" \
            --notes-file "$NOTES"
