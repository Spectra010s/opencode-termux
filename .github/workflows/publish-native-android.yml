name: Publish tested native Android build

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "38381487307"
      SOURCE_SHA: "fb8285f12ada909f13dea7cba34e88d74d0528b0"
      RELEASE_TAG: "v2.0.28"
      ASSET: "opencode-2.0.28-android-aarch64-source-bun140"
      ASSET_SHA256: "76032bc0a5900961a8e3db24923c4a8bedf1523c4ca8bac02e6d2267707e4c52"
    steps:
      - name: Fetch release workflow commit without broken submodules
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=20 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Confirm tested build provenance
        run: |
          set -euo pipefail
          test "$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git diff --quiet "$SOURCE_SHA" HEAD -- .github/workflows/build-native-android.yml scripts/ci tools patches

      - name: Download and verify the successful CI artifact
        run: |
          set -euo pipefail
          mkdir dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "opencode-2.0.28-android-aarch64-source-bun140-candidate" --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          echo "$ASSET_SHA256  dist/$ASSET" | sha256sum -c -
          file "dist/$ASSET" | grep -q 'ARM aarch64'

      - name: Make bandwidth-saving archive
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/$ASSET.tar.gz" "$ASSET"
          (cd dist && sha256sum "$ASSET.tar.gz" >> SHA256SUMS)

      - name: Publish release from CI
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/$ASSET.tar.gz" dist/SHA256SUMS dist/supply-chain-lock.json \
            dist/transplant-report.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'OpenCode 2.0.28 native Termux' \
            --notes-file RELEASE_NOTES.md
