name: Publish tested native Android build

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful native Android candidate run to release
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - name: Check out release workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 20

      - name: Resolve pinned versions from lock
        run: |
          set -euo pipefail
          {
            printf 'RELEASE_TAG=%s\n' "$(python3 tools/ocver.py tag)"
            printf 'ASSET=%s\n' "$(python3 tools/ocver.py asset source)"
          } >> "$GITHUB_ENV"

      - name: Confirm tested build provenance
        run: |
          set -euo pipefail
          case "$SOURCE_RUN" in ''|*[!0-9]*) echo 'source_run must be a numeric Actions run ID' >&2; exit 1 ;; esac
          META="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")"
          test "$(jq -r .conclusion <<<"$META")" = success
          test "$(jq -r .name <<<"$META")" = 'Build locked OpenCode v2 for native Android'
          test "$(jq -r .event <<<"$META")" = workflow_dispatch
          SOURCE_SHA="$(jq -r .head_sha <<<"$META")"
          test "${#SOURCE_SHA}" -eq 40
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git diff --quiet "$SOURCE_SHA" HEAD -- .github/workflows/build-native-android.yml scripts/ci tools patches

      - name: Download and verify the successful CI artifact
        run: |
          set -euo pipefail
          mkdir dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$ASSET-candidate" --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(awk -v name="$ASSET" '$2 == name && length($1) == 64 { count++ } END { print count+0 }' dist/SHA256SUMS)" -eq 1
          file "dist/$ASSET" | grep -q 'ARM aarch64'

      - name: Download and verify the APT candidate
        run: |
          set -euo pipefail
          mkdir dist-apt
          VERSION="$(python3 tools/ocver.py current)"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "opencode-$VERSION-android-aarch64-apt-candidate" --dir dist-apt
          (cd dist-apt && sha256sum -c SHA256SUMS-apt)
          DEB="dist-apt/opencode_${VERSION}-1_aarch64.deb"
          test -f "$DEB"
          test "$(dpkg-deb --field "$DEB" Package)" = opencode
          test "$(dpkg-deb --field "$DEB" Version)" = "$VERSION-1"
          gzip -dc dist-apt/Packages.gz | grep -q "^Version: $VERSION-1$"

      - name: Make bandwidth-saving archive
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/$ASSET.tar.gz" "$ASSET"
          (cd dist && sha256sum "$ASSET.tar.gz" >> SHA256SUMS)

      - name: Include APT candidate hashes in release checksums
        run: |
          set -euo pipefail
          (cd dist-apt && sha256sum opencode_*.deb Packages.gz Release) >> dist/SHA256SUMS

      - name: Publish release from CI
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/$ASSET.tar.gz" dist-apt/opencode_*.deb dist-apt/Packages.gz \
            dist-apt/Release dist-apt/SHA256SUMS-apt dist/SHA256SUMS \
            dist/supply-chain-lock.json dist/transplant-report.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenCode $(python3 tools/ocver.py current) native Termux" \
            --notes-file RELEASE_NOTES.md
